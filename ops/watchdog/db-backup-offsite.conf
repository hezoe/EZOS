# R-024 (2026-11-11): 毎晩の DB バックアップ完了後にオフサイト複製を実行する。
#   A) 当日ダンプ → さくら ~/backups/vps-db (14日保持)
#   B) さくら ~/www → /var/backups/sakura/www-mirror (+月曜スナップショット3世代)
#   D) 秘密情報(鍵・台帳・設定)を暗号化 → さくら ~/backups/vps-secrets (30日保持)
# 実体: /usr/local/sbin/offsite-backup.sh (root所有)
[Service]
ExecStartPost=/usr/local/sbin/offsite-backup.sh
